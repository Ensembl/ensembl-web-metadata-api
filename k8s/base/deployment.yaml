apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-api-server
  template:
    metadata:
      labels:
        app: metadata-api-server
    spec:
      imagePullSecrets:
        - name: ensemblweb-pull-secret 
      containers:
        - name: metadata-api
          image: DOCKER_IMAGE
          ports:
            - containerPort: 8014
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: metadata-api-configmap
          env:
            # Aggregate HTTP metrics across workers; process CPU/memory metrics are unavailable.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-metrics
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /tmp/prometheus-metrics
              rm -f /tmp/prometheus-metrics/*.db
              exec uvicorn main:app \
                --host 0.0.0.0 \
                --port 8014
